<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Climate Art Gallery · 전시관</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="topbar-inner"><div class="brand"><small>GENERATIVE AI × CLIMATE CHANGE</small><h1>Climate Art Gallery</h1></div><nav class="nav"><a href="index.html">작품 제출</a><a class="active" href="gallery.html">전시관</a></nav></div></header>
<main class="page"><section class="hero"><div><div class="kicker">CLASS EXHIBITION</div><h2>우리의 기후 변화 명화전</h2><p>각자 만든 작품과 설명을 감상해 보세요. 작품을 누르면 큰 화면으로 볼 수 있습니다.</p></div><div class="hero-note">전시된 작품은 생성형 AI를 활용한 학생 창작물입니다. 작품 설명과 시각적 표현을 함께 보며 서로 다른 메시지 전달 방식을 비교해 보세요.</div></section>
<div class="gallery-head"><div><div class="kicker">EXHIBITION WALL</div><h2>Gallery</h2><p id="countText">작품을 불러오는 중입니다.</p></div><button id="refreshBtn" class="btn">새로고침</button></div><section id="gallery" class="gallery"><div class="empty">전시 작품을 불러오는 중입니다…</div></section></main>
<div id="modal" class="modal"><button class="modal-close" id="modalClose">×</button><div class="modal-card"><div class="modal-img"><img id="modalImg" alt=""></div><div class="modal-info"><h3 id="modalTitle"></h3><p id="modalDesc"></p></div></div></div>
<script src="config.js"></script><script>
const $=id=>document.getElementById(id);function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderGallery(items){if(!Array.isArray(items))items=[];$('countText').textContent=`총 ${items.length}점이 전시되어 있습니다.`;if(!items.length){$('gallery').innerHTML='<div class="empty">아직 전시된 작품이 없습니다.</div>';return}$('gallery').innerHTML=items.map((x,i)=>`<article class="art-card" data-i="${i}"><div class="art-img"><img src="${x.imageUrl}" alt="${esc(x.title)}"></div><div class="art-info"><h3 class="art-title">${esc(x.title)}</h3><div class="art-desc">${esc(x.description)}</div></div></article>`).join('');document.querySelectorAll('.art-card').forEach(card=>card.onclick=()=>{const x=items[+card.dataset.i];$('modalImg').src=x.imageUrl;$('modalTitle').textContent=x.title;$('modalDesc').textContent=x.description;$('modal').classList.add('show')})}window.renderGallery=renderGallery;
function loadGallery(){$('gallery').innerHTML='<div class="empty">전시 작품을 불러오는 중입니다…</div>';if(WEB_APP_URL.startsWith('PASTE_')){$('gallery').innerHTML='<div class="empty">전시관이 아직 서버와 연결되지 않았습니다.</div>';$('countText').textContent='';return}const old=document.getElementById('jsonpScript');if(old)old.remove();const s=document.createElement('script');s.id='jsonpScript';s.src=WEB_APP_URL+(WEB_APP_URL.includes('?')?'&':'?')+'action=list&callback=renderGallery&t='+Date.now();s.onerror=()=>{$('gallery').innerHTML='<div class="empty">작품 목록을 불러오지 못했습니다.</div>'};document.body.appendChild(s)}
$('refreshBtn').onclick=loadGallery;$('modalClose').onclick=()=> $('modal').classList.remove('show');$('modal').onclick=e=>{if(e.target===$('modal'))$('modal').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('show')});loadGallery();
</script></body></html>
